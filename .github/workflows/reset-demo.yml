# Devuelve la demo pública a su estado de exhibición, todas las noches.
#
# Quien entra a https://lavanderia-el-sol-demo.vercel.app lo hace como
# administrador y puede borrar el inventario o poner cualquier cosa en el
# nombre del negocio. Esto lo deshace y vuelve a sembrar los 90 días de datos.
#
# Necesita los secretos DEMO_DATABASE_URL (la cadena de Neon) y FLY_API_TOKEN
# (token de despliegue de la app de Fly de la demo) en
# Settings → Secrets and variables → Actions.
#
# Si el job aborta con "la base tiene N notas fuera de pruebas", la base de la
# demo se contaminó: se barre lanzando el script a mano con --forzar. Aquí no se
# pasa la bandera a propósito, para que el trabajo automático nunca borre a
# ciegas una base que no sea la de la demo.
name: Restaurar la demo

on:
  schedule:
    # 09:00 UTC = 03:00 en México, que no tiene horario de verano desde 2022.
    - cron: '0 9 * * *'
  workflow_dispatch:        # para lanzarlo a mano desde la pestaña Actions

jobs:
  restaurar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar pnpm
        run: npm install -g pnpm@11

      # Las migraciones de la demo solo corren al desplegar su backend
      # (release_command de fly.demo.toml). Si nadie lo despliega, la base se
      # queda atrás y el reset aborta (pasó del 10 al 12 de octubre de 2026).
      # Desplegar aquí cada noche deja el backend y la base al día con main.
      # Necesita el secreto FLY_API_TOKEN (fly tokens create deploy -a lavanderia-el-sol-demo).
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Desplegar el backend de la demo
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "Falta el secreto FLY_API_TOKEN." >&2
            exit 1
          fi
          flyctl deploy -c fly.demo.toml --ha=false --remote-only

      - name: Instalar dependencias del backend
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Restaurar la demo
        working-directory: backend
        env:
          DEMO_DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
          # El seeder fecha las notas con la zona del proceso, y el runner va en
          # UTC: sin esto, el "hoy" de la demo no coincide con el del negocio.
          TZ: America/Mexico_City
        run: |
          if [ -z "$DEMO_DATABASE_URL" ]; then
            echo "Falta el secreto DEMO_DATABASE_URL." >&2
            exit 1
          fi
          # El script lee la conexión de .env.demo, nunca del .env normal.
          printf 'DATABASE_URL=%s\n' "$DEMO_DATABASE_URL" > .env.demo
          node scripts/reset-demo.mjs
